name: Web CI

on:
  push:
    branches: [master]
  # Repo is PUBLIC and runs on a self-hosted runner: restrict PR runs to PRs
  # targeting master, and require maintainer approval for outside contributors
  # (set in repo Actions settings) so forks cannot execute arbitrary code on
  # the runner.
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, test & build
    runs-on: [self-hosted, ayumi]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check (astro check)
        run: pnpm --filter rootmyandroid-web check

      - name: Run tests with coverage
        run: pnpm --filter rootmyandroid-web test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./apps/web/coverage/lcov.info
          flags: web
          fail_ci_if_error: false

      - name: Build (static export)
        run: pnpm --filter rootmyandroid-web build

  deploy:
    name: Deploy to Cloudflare Pages
    needs: test
    # Deploy only from master, and only after lint+tests+build pass.
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: [self-hosted, ayumi]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (static export)
        run: pnpm --filter rootmyandroid-web build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: rootmyandroid
          directory: apps/web/dist
          branch: master
