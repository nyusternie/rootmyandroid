# .github/workflows/android.yml
name: Android app build

# Builds the Root My Android Android edition (apps/android, package
# com.rootmyandroid) as a RELEASE APK for on-device UI/UX iteration on the
# USB-attached Pixel 5 (owner ruling 2026-11-13: the physical-device deploy
# target follows the active workstream — see .agents/skills/build/SKILL.md).
# Manual dispatch only. Signed with the upload keystore that is generated
# ONE-TIME inside the CI run into /home/gh-runner/secrets/ on blackhost
# (owner ruling 2026-11-13 — the v1.0.0 upload key, CN=RootMyAndroid Upload,
# cert SHA-256 0f3d92ee…, could not be located on any sanctioned credential
# store; repo rule 11: credentials live ONLY on blackhost, so the new key +
# its random password live in the runner-local secrets file and never leave
# the runner). Foreign runners fall back to the public debug key.
# Iteration builds only, never a production release; linked from /downloads
# with an explicit iteration-only disclosure. Installs from the v1.0.0
# preview or earlier debug-signed builds need a ONE-TIME uninstall before
# updating (different key = signature mismatch).
# Install with: adb install -r rootmyandroid-release.apk

on:
  workflow_dispatch: {}

permissions:
  contents: write # rolling prerelease asset upload

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test & build release APK
    runs-on: [self-hosted, blackhost]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.21.0

      # setup-node caches the path printed by `pnpm store path`; pinning
      # store-dir keeps that path real (otherwise the post-job cache save
      # fails the job with "Path Validation Error").
      - name: Pin pnpm store path
        run: pnpm config set store-dir /home/gh-runner/pnpm-store/mobile

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # blackhost is a minimal image: setup-android shells out to `unzip`,
      # which is not preinstalled there.
      - name: Ensure unzip
        run: command -v unzip || (sudo apt-get update && sudo apt-get install -y unzip)

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Default "tools platform-tools" fails: the legacy `tools` package
          # no longer exists in current SDK repositories.
          packages: platform-tools

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          # Platform 37's package id carries the dotted minor (verified
          # against the known-good local SDK): platforms;android-37.0
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --store-dir /home/gh-runner/pnpm-store/mobile

      - name: Run tests (all workspace packages)
        run: pnpm -r test

      # Upload keystore: lives ONLY on blackhost (repo rule 11 — owner
      # ruling 2026-11-13; the v1.0.0 key could not be located on any
      # sanctioned store). Generated one-time into the runner's home; the
      # random password is written to the runner-local properties file and
      # never leaves the runner or the transcript. setup-java above put
      # keytool on PATH.
      - name: Ensure upload keystore (blackhost-local, one-time)
        run: |
          set -e
          SECRETS=/home/gh-runner/secrets
          KS="$SECRETS/rootmyandroid-upload.keystore"
          PROPS="$SECRETS/rootmyandroid-upload.properties"
          if [ ! -f "$KS" ]; then
            mkdir -p "$SECRETS"
            PW=$(openssl rand -hex 24)
            keytool -genkeypair -keystore "$KS" -alias rootmyandroid-upload \
              -keyalg RSA -keysize 4096 -validity 10000 -storetype PKCS12 \
              -dname "CN=Root My Android Upload, OU=Engineering, O=Root My Android" \
              -storepass "$PW" -keypass "$PW"
            printf 'ROOTMYANDROID_UPLOAD_STORE_FILE=%s\nROOTMYANDROID_UPLOAD_KEY_ALIAS=rootmyandroid-upload\nROOTMYANDROID_UPLOAD_STORE_PASSWORD=%s\nROOTMYANDROID_UPLOAD_KEY_PASSWORD=%s\n' "$KS" "$PW" "$PW" > "$PROPS"
            chmod 700 "$SECRETS"
            chmod 600 "$KS" "$PROPS"
          fi

      # gradle.properties is gitignored (it can carry local, machine-specific
      # and secret values), so the runner writes a deterministic one. The
      # ROOTMYANDROID_UPLOAD_* properties come from the blackhost-local
      # secrets file when present; otherwise the committed, PUBLIC
      # debug.keystore is used (the same credentials the build.gradle debug
      # block already carries in plaintext) — iteration fallback only.
      - name: Write gradle.properties
        run: |
          cat > apps/android/android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
          android.useAndroidX=true
          reactNativeArchitectures=armeabi-v7a,arm64-v8a
          newArchEnabled=true
          hermesEnabled=true
          edgeToEdgeEnabled=true
          android.builtInKotlin=false
          android.newDsl=false
          EOF
          if [ -r /home/gh-runner/secrets/rootmyandroid-upload.properties ]; then
            cat /home/gh-runner/secrets/rootmyandroid-upload.properties >> apps/android/android/gradle.properties
          else
            cat >> apps/android/android/gradle.properties <<'EOF'
          ROOTMYANDROID_UPLOAD_STORE_FILE=debug.keystore
          ROOTMYANDROID_UPLOAD_STORE_PASSWORD=android
          ROOTMYANDROID_UPLOAD_KEY_ALIAS=androiddebugkey
          ROOTMYANDROID_UPLOAD_KEY_PASSWORD=android
          EOF
          fi

      # RN tooling hardcodes app-local node_modules paths; materialize the
      # symlink farm (untracked local state on dev machines) on the runner.
      - name: Materialize RN node_modules farm
        run: .agents/skills/build/scripts/materialize-rn-farm.sh apps/android

      - name: Build release APK
        run: cd apps/android/android && ./gradlew assembleRelease --no-daemon

      # Published as a rolling prerelease asset instead of an Actions
      # artifact: the account's Actions artifact-storage quota is exhausted
      # (recalculated every 6-12h) and release assets don't count against
      # it. The repo is public; the APK is an upload-signed iteration build —
      # linked publicly from /downloads with an explicit iteration-only
      # disclosure, never as a production release.
      # blackhost has no gh CLI; this action bundles its own client and
      # replaces same-named assets on re-run (rolling prerelease).
      # The asset name follows the release-asset family (rooted-release.apk /
      # guardian-release.apk on android-v1.0.0) so /download links a stable,
      # meaningful URL.
      - name: Stage APK under its public asset name
        run: cp apps/android/android/app/build/outputs/apk/release/app-release.apk rootmyandroid-release.apk

      - name: Publish APK as rolling prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: android-apk
          name: Root My Android (Android edition) APK (rolling)
          body: 'Rolling iteration build of the Android edition (package `com.rootmyandroid`), built from master@${{ github.sha }} on blackhost, signed with our upload key. Review builds — features are rolling out. Install with `adb install -r rootmyandroid-release.apk`.'
          prerelease: true
          files: rootmyandroid-release.apk
