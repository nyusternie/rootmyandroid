name: Guardian Angel APK build

# Builds the Guardian Angel app (apps/guardian-angel — RN 0.88, package
# com.rootmyandroid.guardian_angel) as a RELEASE APK signed with the
# blackhost-local upload keystore, and publishes it as a rolling prerelease
# asset linked from /downloads. Manual dispatch only — see
# .agents/skills/build/SKILL.md.
#
# Asset name: guardian-angel.apk on tag guardian-angel-apk.
# The previous public Guardian artifact was the android-v1.0.0 preview
# (package com.rootmyandroid.guardian); this workflow supersedes it.

on:
  workflow_dispatch: {}

permissions:
  contents: write # rolling prerelease asset upload

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test & build release APK
    runs-on: [self-hosted, blackhost]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.21.0

      # setup-node caches the path printed by `pnpm store path`; pinning
      # store-dir keeps that path real (otherwise the post-job cache save
      # fails the job with "Path Validation Error").
      - name: Pin pnpm store path
        run: pnpm config set store-dir /home/gh-runner/pnpm-store/mobile

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # blackhost is a minimal image: setup-android shells out to `unzip`,
      # which is not preinstalled there.
      - name: Ensure unzip
        run: command -v unzip || (sudo apt-get update && sudo apt-get install -y unzip)

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          # Platform 37's package id carries the dotted minor (verified
          # against the known-good local SDK): platforms;android-37.0
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --store-dir /home/gh-runner/pnpm-store/mobile

      - name: Run Guardian Angel tests
        run: pnpm --filter rootmyandroid-guardian test

      # gradle.properties is gitignored (it can carry local, machine-specific
      # and secret values), so the runner writes a deterministic one — same
      # pattern as android.yml. The ROOTMYANDROID_UPLOAD_* lines come from
      # the blackhost-local secrets file written by android.yml's one-time
      # keystore step; without it the public debug key is the fallback.
      - name: Write gradle.properties
        run: |
          cat > apps/guardian-angel/android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+UseSerialGC
          org.gradle.workers.max=1
          org.gradle.parallel=false
          android.useAndroidX=true
          reactNativeArchitectures=armeabi-v7a,arm64-v8a
          newArchEnabled=true
          hermesEnabled=true
          edgeToEdgeEnabled=true
          android.builtInKotlin=false
          android.newDsl=false
          EOF
          if [ -r /home/gh-runner/secrets/rootmyandroid-upload.properties ]; then
            cat /home/gh-runner/secrets/rootmyandroid-upload.properties >> apps/guardian-angel/android/gradle.properties
          else
            cat >> apps/guardian-angel/android/gradle.properties <<'EOF'
          ROOTMYANDROID_UPLOAD_STORE_FILE=debug.keystore
          ROOTMYANDROID_UPLOAD_STORE_PASSWORD=android
          ROOTMYANDROID_UPLOAD_KEY_ALIAS=androiddebugkey
          ROOTMYANDROID_UPLOAD_KEY_PASSWORD=android
          EOF
          fi

      # RN tooling hardcodes app-local node_modules paths; materialize the
      # symlink farm (untracked local state on dev machines) on the runner.
      - name: Materialize RN node_modules farm
        run: .agents/skills/build/scripts/materialize-rn-farm.sh apps/guardian-angel

      - name: Build release APK
        run: cd apps/guardian-angel/android && ./gradlew assembleRelease --no-daemon

      # Published as a rolling prerelease asset instead of an Actions
      # artifact (the account's Actions artifact-storage quota is exhausted
      # and release assets don't count against it). The repo is public; the
      # APK is an upload-signed iteration build — linked from /downloads.
      # blackhost has no gh CLI; this action bundles its own client and
      # replaces same-named assets on re-run (rolling prerelease).
      - name: Stage APK under its public asset name
        run: cp apps/guardian-angel/android/app/build/outputs/apk/release/app-release.apk guardian-angel.apk

      # Pinned to v2: v3 failed on 2026-11-25 with "Unexpected error
      # fetching GitHub release for tag refs/heads/master" after finding
      # the release (same failure as rootz.yml that day).
      - name: Publish APK as rolling prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: guardian-angel-apk
          name: Guardian Angel APK (rolling)
          body: 'Rolling build of Guardian Angel (package `com.rootmyandroid.guardian_angel`), built from master@${{ github.sha }} on blackhost and signed with our upload key (cert sha256 1c59c4331c9c8f1fc0e41578ef47ac404396ba7596f5a4c8e94528d4886bceca). Install with `adb install -r guardian-angel.apk`.'
          prerelease: true
          files: guardian-angel.apk
