// apps/rootz/app/build.gradle
apply plugin: "com.android.application"
apply plugin: "kotlin-android"

android {
    namespace "com.rootmyandroid.rootz"
    compileSdk 37

    defaultConfig {
        applicationId "com.rootmyandroid.rootz"
        minSdk 24
        targetSdk 36
        // versionCode = YYYYMMDD of versionName (owner ruling 2026-11-11 —
        // the two must ALWAYS match; applies repo-wide).
        versionCode 20261112
        versionName "26.11.11"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Preview builds sign with the public debug key (same pattern
            // as the iOS-edition preview shell). Upload-key signing is TBD
            // when the app ships to customers.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"
    // Material Components UI (toolbar, cards, outlined text fields, buttons).
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
    // Bundled Conscrypt: the pairing flow needs TLS keying-material
    // export (RFC 5705) for SPAKE2. The platform's hidden
    // com.android.org.conscrypt.Conscrypt is not loadable by apps
    // (observed on blueline: Class.forName fails for both names), so we
    // ship our own provider and take EKM from its public API.
    implementation "org.conscrypt:conscrypt-android:2.5.2"
    // Pure-JVM unit tests for the pairing crypto (Ed25519/SPAKE2/HKDF/GCM)
    // — validated against RFC 8032 + RFC 5869 vectors, CI-gated in
    // .github/workflows/rootz.yml.
    testImplementation "junit:junit:4.13.2"
    // org.json is an Android-framework API — the plain JVM test classpath
    // needs the standalone jar (EXACT pin; used by E2eVectorTest through
    // E2eSession's frame JSON).
    testImplementation "org.json:json:20240303"
}
