// apps/rootz/app/build.gradle
apply plugin: "com.android.application"
apply plugin: "kotlin-android"

android {
    namespace "com.rootmyandroid.rootz"
    compileSdk 37

    defaultConfig {
        applicationId "com.rootmyandroid.rootz"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Preview builds sign with the public debug key (same pattern
            // as the iOS-edition preview shell). Upload-key signing is TBD
            // when the app ships to customers.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"
}
