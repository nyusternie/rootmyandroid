apply plugin: "com.android.application"
apply plugin: "com.facebook.react"
apply plugin: "org.jetbrains.kotlin.android"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    // pnpm monorepo: the app's node_modules is a symlink farm into the hoisted
    // workspace-root store, so the standard app-local paths resolve correctly.
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    root = file("../../")
    //   The folder where the react-native NPM package is.
    reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is.
    codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint.
    cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default it is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.rootmyandroid"
    defaultConfig {
        applicationId "com.rootmyandroid"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 20261110
        versionName "26.11.10"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Conditional release signing (docs/HANDOFF.md §8 — F-Droid
        // reproducibility requirement): a clean checkout WITHOUT the
        // ROOTMYANDROID_UPLOAD_* properties must still build, emitting an
        // UNSIGNED release APK (the byte-compare baseline F-Droid
        // reproducibility needs). The properties are injected by CI
        // (.github/workflows/android.yml) from the blackhost-local secrets
        // file — or the public debug fallback — so CI behavior is
        // unchanged. Sidecoin precedent: their app-level build.gradle
        // carries no release signing block at all (unsigned by default).
        release {
            if (project.hasProperty('ROOTMYANDROID_UPLOAD_STORE_FILE')) {
                storeFile file(ROOTMYANDROID_UPLOAD_STORE_FILE)
                storePassword ROOTMYANDROID_UPLOAD_STORE_PASSWORD
                keyAlias ROOTMYANDROID_UPLOAD_KEY_ALIAS
                keyPassword ROOTMYANDROID_UPLOAD_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            if (project.hasProperty('ROOTMYANDROID_UPLOAD_STORE_FILE')) {
                signingConfig signingConfigs.release
            }
            // else: signingConfig stays null → unsigned APK
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    // F-Droid policy (docs/FDROID-SUBMISSION-PLAN.md, owner rulings
    // 2026-11-13): the `fdroid` flavor ships FOSS-only UI — no billing
    // chip, no PRO upsell, everything free — and is the flavor F-Droid
    // builds and byte-compares against our hosted APK. `appstore` is the
    // store/sideload build (the same binary family headed to Google Play;
    // the name is store-neutral per the sidecoin precedent).
    flavorDimensions "distribution"
    productFlavors {
        fdroid {
            dimension "distribution"
        }
        appstore {
            dimension "distribution"
        }
    }

    // AGP 7+ writes a "Dependency metadata" (0x504b4453) signing block that
    // is read only by Play Console tooling; fdroidserver's `check apk`
    // rejects it outright (sidecoin finding, commit 362709c).
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    // Deflate bundled .so files. AGP's default stores them uncompressed so
    // the loader can mmap them (better install size/startup), but the
    // download balloons; F-Droid ships a single universal APK per version,
    // so download size wins (sidecoin: 74,521,086 -> 35,187,266 bytes).
    // Use the DSL flag, not the manifest attribute: AGP writes
    // extractNativeLibs=false after manifest merge and can override a
    // hand-written attribute.
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

// Reproducibility (docs/FDROID-SUBMISSION-PLAN.md §2): the React Native
// Gradle plugin bakes the BUILD MACHINE's first non-loopback IPv4 into the
// react_native_dev_server_ip resource (AgpConfiguratorUtils.getHostIpAddress),
// so two builders produce different resources.arsc for the same commit — the
// exact failure that broke sidecoin's byte-compare (fixed in their 7aa639f).
// Pinning it to localhost makes the release resource constant. The resValue
// must be set from a finalizeDsl callback: ReactPlugin sets it from its own
// finalizeDsl callback, and later callbacks win. Nothing in the release
// bundle path reads the value (its only consumer is the dev-only
// ChangeBundleLocationDialog).
androidComponents {
    finalizeDsl { ext ->
        ext.defaultConfig.resValue("string", "react_native_dev_server_ip", "localhost")
        // Reproducibility CMake flags (root build.gradle defines them once):
        // :app compiles libappmodules.so plus the new-architecture codegen
        // libraries (libreact_codegen_rnsvg.so,
        // libreact_codegen_safeareacontext.so) — the measured two-path
        // byte-diff on 2026-11-16. This callback runs AFTER ReactPlugin's
        // own finalizeDsl (the React plugin is applied earlier in this
        // file), so the flags survive — the same ordering the
        // react_native_dev_server_ip pin above already relies on.
        def cmake = ext.defaultConfig.externalNativeBuild.cmake
        cmake.cppFlags(*rootProject.ext.reproCmakeFlags)
        cmake.cFlags(*rootProject.ext.reproCmakeFlags)
        cmake.arguments(*rootProject.ext.reproCmakeArguments)
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    // QR scanner (owner request 2026-11-13): CameraX preview + analysis.
    // The decoder is ZXing core (Apache-2.0, built from source) — ML Kit's
    // barcode-scanning AAR is a CLOSED-SOURCE Google binary and would be
    // rejected by F-Droid (sidecoin removed vision-camera/MLKit for exactly
    // this reason). QR-only use keeps ZXing coverage sufficient. Pinned
    // exact per the repo's dependency rule.
    implementation("androidx.camera:camera-core:1.4.1")
    implementation("androidx.camera:camera-camera2:1.4.1")
    implementation("androidx.camera:camera-lifecycle:1.4.1")
    implementation("androidx.camera:camera-view:1.4.1")
    implementation("androidx.lifecycle:lifecycle-process:2.8.7")
    implementation("com.google.zxing:core:3.5.3")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
