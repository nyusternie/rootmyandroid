# apps/android/android/gradle.properties
#
# COMMITTED BASE (F-Droid clean-checkout requirement, 2026-11-16): without
# this file AGP's built-in Kotlin registers the 'kotlin' extension and the
# standalone org.jetbrains.kotlin.android plugin then fails evaluation with
# "Cannot add extension with name 'kotlin'" — the from-source F-Droid build
# would crash before compiling anything. Values below are byte-identical to
# the base heredoc in .github/workflows/android.yml; CI overwrites with the
# same content and APPENDS the ROOTMYANDROID_UPLOAD_* signing properties
# from the blackhost-local secrets file. Never commit secrets here.

# Project-wide Gradle settings.

# JVM tuning (matches the CI runner)
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+UseSerialGC
kotlin.daemon.jvmargs=-Xmx768m
org.gradle.workers.max=1
org.gradle.parallel=false

# Use AndroidX
android.useAndroidX=true

# Ship only ARM ABIs (x86/x86_64 exist only for emulators)
reactNativeArchitectures=armeabi-v7a,arm64-v8a

# New Architecture
newArchEnabled=true

# Hermes JS engine
hermesEnabled=true

# Edge-to-edge
edgeToEdgeEnabled=true

# AGP built-in Kotlin OFF — the standalone kotlin.android plugin is applied
# explicitly in app/build.gradle (built-in + standalone collide otherwise)
android.builtInKotlin=false

# Classic AGP DSL
android.newDsl=false
