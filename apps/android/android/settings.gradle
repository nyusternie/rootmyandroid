// pnpm monorepo (nodeLinker: hoisted): dependencies live in the
// workspace-root node_modules; the app-local node_modules symlink farm
// exists only on machines where it was materialized locally, NOT on fresh
// runner checkouts. Resolve the RN gradle plugin from whichever location
// exists. NOTE: pluginManagement {} must be the first block in this file,
// so the app-local/workspace-root fallback is computed inline here and
// recomputed below for the trailing includeBuild.
pluginManagement {
    def appLocal = "../node_modules/@react-native/gradle-plugin"
    def workspaceRoot = "../../../node_modules/@react-native/gradle-plugin"
    includeBuild(file(appLocal).exists() ? appLocal : workspaceRoot)
}
plugins { id("com.facebook.react.settings") }
// Autolinking command: run the React Native CLI with the NODE BINARY and an
// explicit path instead of the default `npx @react-native-community/cli
// config`. On the F-Droid build VM (fdroiddata pipeline 3096488646, job
// 18239957997) `npx` exited 1 at this line: with no TTY and no network it
// cannot resolve the package, and the build dies at settings evaluation.
// `node <cli>/build/bin.js config` needs no resolution and no network.
// Path resolution mirrors the pluginManagement block above: app-local first
// (machines where pnpm materialized it), workspace root otherwise (fresh
// checkouts with nodeLinker: hoisted).
def rnCliAppLocal = file("../node_modules/@react-native-community/cli/build/bin.js")
def rnCliWorkspace = file("../../../node_modules/@react-native-community/cli/build/bin.js")
def rnCli = rnCliAppLocal.exists() ? rnCliAppLocal : rnCliWorkspace
// DIAGNOSTIC (temporary, 26.11.22): the F-Droid build VM fails this command
// with exit 1 while the same command succeeds in `init:` on the same tree,
// so print the real stderr + the node that Gradle resolves before Gradle
// runs it. Remove once the cause is known.
try {
    def probe = ["bash", "-lc", "which -a node; node --version; node ${rnCli.absolutePath} config >/dev/null"].execute(null, file("."))
    probe.waitFor()
    println "AUTOLINK PROBE exit=${probe.exitValue()}"
    println "AUTOLINK PROBE stdout=" + probe.in.text
    println "AUTOLINK PROBE stderr=" + probe.err.text
} catch (Exception e) {
    println "AUTOLINK PROBE exception=" + e
}
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand(["node", rnCli.absolutePath, "config"]) }
rootProject.name = 'com.rootmyandroid'
include ':app'
def rnGradlePlugin = file("../node_modules/@react-native/gradle-plugin")
if (!rnGradlePlugin.exists()) {
    rnGradlePlugin = file("../../../node_modules/@react-native/gradle-plugin")
}
includeBuild(rnGradlePlugin)
