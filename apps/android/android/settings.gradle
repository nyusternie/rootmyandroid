// pnpm monorepo (nodeLinker: hoisted): dependencies live in the
// workspace-root node_modules; the app-local symlink farm exists only on
// machines where it was materialized locally, NOT on fresh runner
// checkouts. Resolve the RN gradle plugin from whichever location exists.
def rnGradlePlugin = file("../node_modules/@react-native/gradle-plugin")
if (!rnGradlePlugin.exists()) {
    rnGradlePlugin = file("../../node_modules/@react-native/gradle-plugin")
}
pluginManagement { includeBuild(rnGradlePlugin) }
plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand() }
rootProject.name = 'com.rootmyandroid'
include ':app'
includeBuild(rnGradlePlugin)
