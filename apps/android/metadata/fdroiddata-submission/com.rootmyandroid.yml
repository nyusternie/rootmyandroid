Builds:
  - versionName: 26.11.29
    versionCode: 20261129
    commit: dee1357ea41af75a998a9b0eab28efd1ff7717ca
    subdir: apps/android/android/app
    sudo:
      - apt-get update
      - echo "deb https://deb.debian.org/debian forky main" > /etc/apt/sources.list.d/forky.list
      - apt-get update
      - apt-get install -y -t forky nodejs npm
      - npm install -g pnpm@11.21.0
    init:
      - cd ../../../..
      - pnpm install --frozen-lockfile
      - mkdir -p apps/android/node_modules/@react-native
      - ln -sfn ../../../node_modules/react-native apps/android/node_modules/react-native
      - ln -sfn ../../../../node_modules/@react-native/codegen apps/android/node_modules/@react-native/codegen
      - ln -sfn ../../../node_modules/hermes-compiler apps/android/node_modules/hermes-compiler
      - sed -i '/jvmToolchain\|JavaVersion/s/17/21/' node_modules/@react-native/gradle-plugin/*/build.gradle.kts
        node_modules/@react-native/gradle-plugin/react-native-gradle-plugin/src/main/kotlin/com/facebook/react/utils/JdkConfiguratorUtils.kt
      - cd apps/android/android/app
    gradle:
      - fdroid
    scanignore:
      - node_modules/react-native/ReactAndroid/publish.gradle
      - node_modules/hermes-compiler/hermesc/linux64-bin/hermesc
      - node_modules/lottie-react-native/android/build.gradle
      - node_modules/react-native-safe-area-context/android/build.gradle
      - node_modules/react-native-svg/android/build.gradle
    scandelete:
      - node_modules
