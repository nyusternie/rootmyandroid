packages:
  - 'apps/*'
  - 'packages/*'

# Approve dependency build scripts (esbuild's postinstall compiles its
# binary). pnpm 11 requires BOTH the allowBuilds map and onlyBuiltDependencies
# for a clean --frozen-lockfile install; otherwise CI fails with
# ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  esbuild: true
  workerd: true
onlyBuiltDependencies:
  - esbuild
  - workerd
